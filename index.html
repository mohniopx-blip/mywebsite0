<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VIBE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0e;
    --surface:#151318;
    --surface2:#1d1a22;
    --border:#2b2733;
    --gold:#e0b25e;
    --gold2:#f4d998;
    --rose:#c1425a;
    --text:#f2ede4;
    --muted:#9a94a6;
    --live:#e14b5a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at top, #17141c 0%, #0b0b0e 55%);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--gold);color:#000;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#3a3542;border-radius:4px;}

  .hidden{display:none !important;}

  /* ---------- Loading ---------- */
  #loadingScreen{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:9999;flex-direction:column;gap:14px;
  }
  .brandmark{font-family:'Fraunces',serif;font-size:38px;letter-spacing:2px;color:var(--gold);font-weight:600;}
  .brandmark span{color:var(--text);}
  .spinner{width:26px;height:26px;border-radius:50%;border:2px solid #2b2733;border-top-color:var(--gold);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Auth ---------- */
  #authScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .authCard{
    width:100%;max-width:380px;background:linear-gradient(180deg,var(--surface),var(--surface2));
    border:1px solid var(--border);border-radius:18px;padding:36px 28px;
    box-shadow:0 30px 60px rgba(0,0,0,0.5);
  }
  .authCard .brandmark{text-align:center;margin-bottom:6px;}
  .authSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px;letter-spacing:0.5px;text-transform:uppercase;}
  .fieldLabel{font-size:12px;color:var(--muted);margin-bottom:8px;display:block;letter-spacing:0.3px;}
  .authInput{
    width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--border);
    background:#0f0d13;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;
  }
  .authInput:focus{border-color:var(--gold);}
  .goldBtn{
    width:100%;margin-top:20px;padding:14px;border-radius:10px;
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    color:#1a1408;font-weight:700;font-size:15px;letter-spacing:0.3px;
    transition:transform .15s;
  }
  .goldBtn:active{transform:scale(0.97);}
  .authMsg{margin-top:14px;font-size:13px;text-align:center;min-height:16px;}
  .authMsg.err{color:var(--rose);}
  .authMsg.ok{color:#7fd99a;}
  .blockedMsg{color:var(--rose);text-align:center;padding:40px 20px;font-size:15px;}

  /* ---------- App Shell ---------- */
  #appShell{min-height:100vh;padding-bottom:78px;}
  header.topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;background:rgba(11,11,14,0.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
  }
  header.topbar .brandmark{font-size:22px;}
  .userChip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .userChip b{color:var(--gold);font-weight:700;}
  .subBadge{font-size:10px;padding:3px 8px;border-radius:20px;background:#1f2a1f;color:#7fd99a;border:1px solid #2c3d2c;}
  .subBadge.locked{background:#2a1d22;color:var(--rose);border-color:#3d2a30;}

  main{padding:20px;max-width:900px;margin:0 auto;}
  .sectionTitle{font-family:'Fraunces',serif;font-size:22px;margin-bottom:16px;color:var(--gold2);}

  /* Video grid */
  .videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .vCard{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .15s, border-color .15s;}
  .vCard:active{transform:scale(0.97);}
  .vThumbWrap{position:relative;aspect-ratio:9/13;background:#1a1720;overflow:hidden;}
  .vThumbWrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .lockTag{
    position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
    border:1px solid rgba(224,178,94,0.4);border-radius:20px;padding:4px 9px;font-size:11px;
    display:flex;align-items:center;gap:4px;color:var(--gold2);
  }
  .playOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,0.75) 100%);
  }
  .playOverlay svg{width:38px;height:38px;opacity:0.9;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));}
  .vMeta{padding:10px 12px;}
  .vTitle{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .vStats{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;}

  /* Live section */
  .liveGrid{display:flex;flex-direction:column;gap:12px;}
  .liveCard{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;
    display:flex;align-items:center;gap:14px;
  }
  .liveThumb{width:76px;height:76px;border-radius:12px;flex-shrink:0;background:#1a1720;position:relative;overflow:hidden;}
  .liveThumb img{width:100%;height:100%;object-fit:cover;}
  .liveDot{position:absolute;top:6px;left:6px;background:var(--live);color:#fff;font-size:9px;font-weight:800;
    padding:2px 6px;border-radius:4px;letter-spacing:0.5px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
  .liveInfo{flex:1;min-width:0;}
  .liveInfo .t{font-weight:700;font-size:14px;margin-bottom:4px;}
  .liveInfo .s{font-size:12px;color:var(--muted);}
  .liveGo{padding:9px 14px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--gold2);white-space:nowrap;}
  .liveGo.now{background:var(--live);color:#fff;border-color:var(--live);}
  .countdownTxt{color:var(--gold2);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0.3px;}

  /* Completed shows */
  .completedSectionTitle{font-family:'Fraunces',serif;font-size:18px;margin:26px 0 12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .completedGrid{display:flex;flex-direction:column;gap:10px;}
  .completedCard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;opacity:0.85;}
  .completedThumb{width:56px;height:56px;border-radius:10px;flex-shrink:0;background:#1a1720;object-fit:cover;filter:grayscale(0.3);}
  .completedInfo{flex:1;min-width:0;}
  .completedInfo .t{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .completedInfo .d{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .completedStats{display:flex;gap:12px;font-size:11px;color:var(--muted);}
  .completedStats span{display:flex;align-items:center;gap:4px;}
  .completedStats svg{width:12px;height:12px;}
  .completedPill{font-size:9px;padding:3px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);font-weight:700;letter-spacing:0.4px;flex-shrink:0;}

  .emptyState{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}

  /* Bottom nav */
  nav.bottomNav{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(11,11,14,0.92);backdrop-filter:blur(16px);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  }
  .navBtn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;color:var(--muted);letter-spacing:0.2px;flex:1;min-width:0;}
  .navBtn svg{width:19px;height:19px;}
  .navBtn.active{color:var(--gold);}
  .navBadgeDot{position:absolute;margin-left:12px;margin-top:-2px;width:8px;height:8px;border-radius:50%;background:var(--rose);border:1.5px solid var(--bg);}

  /* Real Meet */
  .rmIntro{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5;}
  .rmCategoryGrid{display:flex;gap:12px;}
  .rmCategoryCard{flex:1;border:1.5px solid var(--border);border-radius:14px;padding:26px 12px;text-align:center;background:var(--surface);transition:.15s;}
  .rmCategoryCard:active{transform:scale(0.96);border-color:var(--gold);}
  .rmCategoryCard .ico{font-size:30px;margin-bottom:10px;}
  .rmCategoryCard .lbl{font-weight:700;font-size:14px;}
  .rmBackLink{color:var(--muted);font-size:12px;margin-bottom:12px;display:inline-block;}
  .rmPhotoUpload{width:100%;border:1.5px dashed var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:14px;background:var(--surface2);display:block;}
  .rmPhotoUpload img{width:76px;height:76px;object-fit:cover;border-radius:10px;margin:0 auto 8px;display:block;}

  /* Private chat */
  .privateChatWrap{display:flex;flex-direction:column;height:calc(100vh - 232px);min-height:320px;}
  .privateChatMessages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px;}
  .pcMsg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.4;}
  .pcMsg.fromUser{align-self:flex-end;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408;border-bottom-right-radius:4px;}
  .pcMsg.fromAdmin{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .pcMsg img{max-width:100%;border-radius:10px;margin-top:6px;display:block;}
  .pcMsgTime{font-size:10px;opacity:0.6;margin-top:4px;}
  .privateChatInputRow{display:flex;align-items:center;gap:8px;padding:10px 2px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0;}
  .privateChatInputRow input[type=text]{flex:1;padding:12px 16px;border-radius:24px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;}
  .privateChatImgBtn{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:18px;}
  .privateChatSendBtn{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--gold2),var(--rose));display:flex;align-items:center;justify-content:center;}
  .privateChatSendBtn svg{width:17px;height:17px;color:#1a1408;}
  .privateChatImgPreview{font-size:11px;color:var(--gold2);padding:0 2px 6px;display:none;}

  .tabPage{display:none;}
  .tabPage.active{display:block;}

  /* Profile */
  .profileCard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;margin-bottom:16px;}
  .avatarCircle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:#1a1408;}
  .profileName{font-size:18px;font-weight:700;margin-bottom:4px;}
  .profileSince{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .planRow{display:flex;justify-content:space-between;padding:12px 16px;background:var(--surface2);border-radius:10px;font-size:13px;margin-bottom:10px;}
  .planRow .l{color:var(--muted);}
  .logoutBtn{margin-top:8px;color:var(--rose);font-size:13px;font-weight:600;padding:10px;}

  /* Modal */
  .modalOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;z-index:200;
  }
  @media(min-width:640px){.modalOverlay{align-items:center;}}
  .modalCard{
    width:100%;max-width:480px;background:linear-gradient(180deg,var(--surface),var(--surface2));
    border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px;max-height:92vh;overflow-y:auto;
    animation:slideUp .25s ease;
  }
  @media(min-width:640px){.modalCard{border-radius:20px;}}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modalClose{float:right;color:var(--muted);font-size:20px;padding:4px 8px;}
  .modalTitle{font-family:'Fraunces',serif;font-size:20px;color:var(--gold2);margin-bottom:14px;}

  .videoPlayerWrap{width:100%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px;}
  video{width:100%;display:block;max-height:70vh;background:#000;}
  .likeRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .likeBtn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:13px;}
  .likeBtn.liked{color:var(--rose);border-color:var(--rose);}
  .likeBtn svg{width:16px;height:16px;}

  .planOptions{display:flex;gap:10px;margin-bottom:16px;}
  .planCard{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:16px 10px;text-align:center;transition:.15s;}
  .planCard.selected{border-color:var(--gold);background:rgba(224,178,94,0.08);}
  .planCard .price{font-family:'Fraunces',serif;font-size:24px;color:var(--gold2);font-weight:700;}
  .planCard .dur{font-size:12px;color:var(--muted);margin-top:4px;}

  .qrBox{text-align:center;padding:14px;background:var(--surface2);border-radius:14px;margin-bottom:14px;}
  .qrBox img{width:190px;height:190px;object-fit:contain;border-radius:10px;background:#fff;padding:8px;cursor:zoom-in;}
  .qrTapHint{font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px;}
  .qrFullscreenOverlay{position:fixed;inset:0;background:rgba(5,5,7,0.97);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .qrFullscreenOverlay img{width:min(88vw,420px);height:min(88vw,420px);object-fit:contain;background:#fff;border-radius:16px;padding:16px;}
  .qrFullscreenClose{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text);}
  .qrFullscreenText{margin-top:18px;font-size:14px;color:var(--muted);text-align:center;}
  .qrFullscreenText b{color:var(--gold2);}
  .upiText{font-size:13px;color:var(--muted);margin-top:10px;}
  .upiText b{color:var(--text);}

  .pendingBox{text-align:center;padding:30px 16px;}
  .pendingBox .ico{font-size:34px;margin-bottom:10px;}

  /* Live viewer */
  .liveViewerWrap{display:flex;flex-direction:column;height:80vh;max-height:640px;}
  .chatBox{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:8px;}
  .chatMsg{font-size:13px;line-height:1.4;}
  .chatMsg b{color:var(--gold2);margin-right:6px;}
  .chatInputRow{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
  .chatInputRow input{flex:1;padding:11px 14px;border-radius:20px;border:1px solid var(--border);background:#0f0d13;color:var(--text);font-size:13px;}
  .chatInputRow button{padding:10px 16px;border-radius:20px;background:var(--gold);color:#1a1408;font-weight:700;font-size:13px;}
  .memberCount{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-bottom:8px;}
  .liveStageWrap{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .liveStageWrap video{width:100%;display:block;max-height:60vh;background:#000;pointer-events:none;}
  .liveBadgeOverlay{position:absolute;top:10px;left:10px;background:var(--live);color:#fff;font-size:10px;font-weight:800;
    padding:4px 9px 4px 7px;border-radius:6px;display:flex;align-items:center;gap:5px;letter-spacing:0.5px;z-index:2;}
  .liveBadgeOverlay .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;}
  .stageBtn{position:absolute;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.55);
    backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:2;}
  .stageBtn svg{width:16px;height:16px;color:#fff;}
  #muteToggleBtn{right:52px;}
  #fsToggleBtn{right:10px;}
  .countdownBig{text-align:center;padding:40px 10px;}
  .countdownBig .num{font-family:'Fraunces',serif;font-size:52px;color:var(--gold);}

  /* ---------- Full-screen live experience ---------- */
  .liveFull{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;}
  .liveFullTop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:#0d0d10;flex-shrink:0;}
  .liveFullTop .left{display:flex;flex-direction:column;gap:2px;}
  .liveFullTop .titleTxt{font-size:14px;font-weight:700;}
  .liveFullTop .subRow{display:flex;align-items:center;gap:8px;}
  .liveBadgePill{background:var(--live);color:#fff;font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;}
  .liveBadgePill .dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;}
  .watchingPill{background:var(--surface2);color:var(--muted);font-size:11px;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;}
  .homeBtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:8px 14px;border-radius:20px;font-weight:600;flex-shrink:0;}

  .liveFullStage{position:relative;flex-shrink:0;background:#000;overflow:hidden;height:40vh;min-height:220px;}
  .liveFullStage video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .stageTimerPill{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);color:var(--text);
    font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;letter-spacing:0.5px;z-index:2;font-variant-numeric:tabular-nums;}

  .reactionRow{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;flex-shrink:0;background:#0b0b0e;}
  .reactionChip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);
    border-radius:20px;padding:8px 13px;font-size:13px;flex-shrink:0;transition:transform .12s;}
  .reactionChip:active{transform:scale(0.9);}
  .reactionChip .cnt{color:var(--muted);font-size:12px;font-weight:700;}

  .liveChatLabel{display:flex;align-items:center;gap:7px;padding:6px 14px 10px;color:var(--gold2);font-size:12px;font-weight:800;letter-spacing:0.5px;flex-shrink:0;}
  .liveFullChat{flex:1;overflow-y:auto;padding:2px 14px;display:flex;flex-direction:column;gap:12px;min-height:0;}
  .chatRow{display:flex;gap:9px;align-items:flex-start;}
  .chatAvatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#1a1408;flex-shrink:0;}
  .chatBody .cname{font-size:12px;font-weight:700;margin-bottom:2px;}
  .chatBody .ctext{font-size:13px;color:var(--text);line-height:1.3;}

  .liveFullInputRow{display:flex;align-items:center;gap:9px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:#0d0d10;border-top:1px solid var(--border);flex-shrink:0;}
  .liveFullInputRow input{flex:1;padding:12px 16px;border-radius:24px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;}
  .sendCircleBtn{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--gold2),var(--rose));
    display:flex;align-items:center;justify-content:center;}
  .sendCircleBtn svg{width:17px;height:17px;color:#1a1408;}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="brandmark">VI<span>BE</span></div>
  <div class="spinner"></div>
</div>

<!-- AUTH -->
<div id="authScreen" class="hidden">
  <div class="authCard">
    <div class="brandmark">VI<span>BE</span></div>
    <div class="authSub">Premium Content</div>
    <label class="fieldLabel">Choose a username</label>

async function handleSignup(){
  const val = document.getElementById('usernameInput').value.trim().toLowerCase().replace(/\s+/g,'_');

  if(snap.exists()){

    return;
  }
  await db.ref('users/'+val).set({
    username: val,
    createdAt: firebase.database.ServerValue.TIMESTAMP,

/* ============ LIVE ============ */
function bindLiveListener(){
  db.ref('liveSchedules').on('value', snap=>{
    schedulesCache = snap.val() || {};
    renderLive();
  });
  setInterval(renderLive, 15000);
  startLiveCountdownTicker();
}

function scheduleState(s){
  const now = Date.now();
  const start = new Date(s.startTime).getTime();
  const end = start + (s.durationMinutes||30)*60000;
  if(now < start) return {state:'upcoming', start, end};
  if(now >= start && now <= end) return {state:'live', start, end};
  return {state:'ended', start, end};
}

/* ============ COUNTDOWN ============ */
function formatCountdown(ms){
  if(ms <= 0) return 'Starting...';
  const totalSec = Math.floor(ms/1000);
  const days = Math.floor(totalSec/86400);
  const hours = Math.floor((totalSec%86400)/3600);
  const mins = Math.floor((totalSec%3600)/60);
  const secs = totalSec%60;
  const pad = n=>n.toString().padStart(2,'0');
  if(days>0) return `Starts in ${days}d ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
  return `Starts in ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
}

let _liveCountdownTicker = null;
function startLiveCountdownTicker(){
  if(_liveCountdownTicker) clearInterval(_liveCountdownTicker);
  _liveCountdownTicker = setInterval(()=>{
    let needsFullRerender = false;
    Object.keys(schedulesCache).forEach(id=>{
      const st = scheduleState(schedulesCache[id]);
      const el = document.getElementById('countdown-'+id);
      if(st.state === 'upcoming' && el){
        el.textContent = formatCountdown(st.start - Date.now());
      } else if(st.state !== 'upcoming' && el){
        // stream just went live or ended mid-tick — refresh the list structure
        needsFullRerender = true;
      }
    });
    if(needsFullRerender) renderLive();
  }, 1000);
}

function renderLive(){
  const ids = Object.keys(schedulesCache);
  const visible = ids.filter(id=> scheduleState(schedulesCache[id]).state !== 'ended');
  visible.sort((a,b)=> new Date(schedulesCache[a].startTime) - new Date(schedulesCache[b].startTime));
  document.getElementById('liveEmpty').classList.toggle('hidden', visible.length>0);
  document.getElementById('liveGrid').innerHTML = visible.map(id=>{
    const s = schedulesCache[id];
    const st = scheduleState(s);
    let sub;
    if(st.state==='live') sub = 'LIVE NOW · ' + (s.type||'Stream');
    else sub = `<span class="countdownTxt" id="countdown-${id}">${formatCountdown(st.start-Date.now())}</span>`;
    return `<div class="liveCard">
      <div class="liveThumb">
        ${st.state==='live'?'<div class="liveDot">LIVE</div>':''}
        <img src="${s.thumbnailUrl||''}">
      </div>
      <div class="liveInfo">
        <div class="t">${escapeHtml(s.title||'Live Stream')}</div>
        <div class="s">${sub}</div>
      </div>
      <button class="liveGo ${st.state==='live'?'now':''}" onclick="openLive('${id}')">${st.state==='live'?'Watch':'Remind'}</button>
    </div>`;
  }).join('');

  renderCompletedShows();
}

function formatDurationMin(mins){
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), m = mins%60;
  return m ? `${h}h ${m}m` : `${h}h`;
}

function eyeIconSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;}

// Deterministic pseudo-random number in [min,max] based on a string seed (same id always gives same number)
function seededRandomInRange(seedStr, min, max){
  let hash = 0;
  for(let i=0;i<seedStr.length;i++){
    hash = (hash << 5) - hash + seedStr.charCodeAt(i);
    hash |= 0;
  }
  const normalized = Math.abs(hash % 10000) / 10000;
  return Math.floor(min + normalized * (max - min + 1));
}

function renderCompletedShows(){
  const ids = Object.keys(schedulesCache).filter(id=> scheduleState(schedulesCache[id]).state === 'ended');
  ids.sort((a,b)=> new Date(schedulesCache[b].startTime) - new Date(schedulesCache[a].startTime));
  document.getElementById('completedEmpty').classList.toggle('hidden', ids.length>0);
  document.getElementById('completedGrid').innerHTML = ids.map(id=>{
    const s = schedulesCache[id];
    const dateStr = new Date(s.startTime).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const viewCount = seededRandomInRange(id+'-views', 20, 30);
    const reactionCount = seededRandomInRange(id+'-reactions', 30, 40);
    return `<div class="completedCard">
      <img class="completedThumb" src="${s.thumbnailUrl||''}">
      <div class="completedInfo">
        <div class="t">${escapeHtml(s.title||'Live Stream')}</div>
        <div class="d">${dateStr} · ${formatDurationMin(s.durationMinutes||30)}${s.type ? ' · '+escapeHtml(s.type) : ''}</div>
        <div class="completedStats">
          <span>${eyeIconSvg()} ${viewCount} watched</span>
          <span>${heartIconSvg()} ${reactionCount} reactions</span>
        </div>
      </div>
      <span class="completedPill">ENDED</span>
    </div>`;
  }).join('');
}

const RANDOM_CHAT_NAMES = ['Abhishek','Arjun','Adish','Alok','Aman','Rohit','Priya','Simran','Kabir','Neha','Rahul','Anjali','Vikram','Sneha','Karan'];
const RANDOM_CHAT_LINES = ['Hii','Wow','🔥🔥🔥','Love you so much❤️','kitna sundar ho aap','next kab milega','superb👏','omg amazing','yeh best hai','😍😍😍','real meet kroge','waiting for this','nice content','👏👏👏','osm'];

function avatarColorFor(name){
  let sum=0; for(let i=0;i<name.length;i++) sum += name.charCodeAt(i);
  return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}
function chatRowHtml(username, message){
  const initial = (username||'?').charAt(0).toUpperCase();
  return `<div class="chatRow">
    <div class="chatAvatar" style="background:${avatarColorFor(username)}">${initial}</div>
    <div class="chatBody"><div class="cname" style="color:${avatarColorFor(username)}">${escapeHtml(username)}</div><div class="ctext">${escapeHtml(message)}</div></div>

/* ============ PRIVATE CHAT (User <-> Admin) ============
   Firebase structure:
   privateChats/{username}/{pushId} = { sender:'user'|'admin', text?, imageUrl?, timestamp }
   chatMeta/{username} = { lastMessage, lastMessageAt, lastSender, unreadForAdmin, unreadForUser }
*/
let _privateChatSelectedFile = null;

function bindPrivateChat(){
  const box = document.getElementById('privateChatMessages');
  box.innerHTML = '';
  db.ref('privateChats/'+currentUser).limitToLast(200).on('child_added', snap=>{
    box.insertAdjacentHTML('beforeend', privateChatBubbleHtml(snap.val()));
    box.scrollTop = box.scrollHeight;
  });
  db.ref('chatMeta/'+currentUser).on('value', snap=>{
    const meta = snap.val() || {};
    document.getElementById('chatNavDot').classList.toggle('hidden', !meta.unreadForUser);
  });
}

function privateChatBubbleHtml(m){
  const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '';
  const isUser = m.sender === 'user';
  const imgHtml = m.imageUrl ? `<img src="${m.imageUrl}">` : '';
  const textHtml = m.text ? `<div>${escapeHtml(m.text)}</div>` : '';
  return `<div class="pcMsg ${isUser?'fromUser':'fromAdmin'}">${textHtml}${imgHtml}<div class="pcMsgTime">${time}</div></div>`;
}

function handlePrivateChatImgSelect(){
  const fileInput = document.getElementById('privateChatImgInput');
  const preview = document.getElementById('privateChatImgPreview');
  _privateChatSelectedFile = fileInput.files[0] || null;
  if(_privateChatSelectedFile){
    preview.textContent = '📷 ' + _privateChatSelectedFile.name + ' selected — tap send';
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

async function sendPrivateMessage(){
  const input = document.getElementById('privateChatInput');
  const text = input.value.trim();
  const file = _privateChatSelectedFile;
  if(!text && !file) return;

  let imageUrl = null;
  if(file){
    try{ imageUrl = await uploadToCloudinary(file); }
    catch(err){ alert('Image upload failed'); return; }
  }

  const msgId = db.ref('privateChats/'+currentUser).push().key;
  const msg = { sender:'user', timestamp: firebase.database.ServerValue.TIMESTAMP };
  if(text) msg.text = text;
  if(imageUrl) msg.imageUrl = imageUrl;
  await db.ref('privateChats/'+currentUser+'/'+msgId).set(msg);

  await db.ref('chatMeta/'+currentUser).update({
    lastMessage: text || '📷 Photo',
    lastMessageAt: firebase.database.ServerValue.TIMESTAMP,
    lastSender: 'user',
    unreadForAdmin: true,
    unreadForUser: false
  });

  input.value = '';
  _privateChatSelectedFile = null;
  document.getElementById('privateChatImgInput').value = '';
  document.getElementById('privateChatImgPreview').style.display = 'none';
}

document.getElementById('privateChatInput')?.addEventListener('keydown', e=>{ if(e.key==='Enter') sendPrivateMessage(); });

/* ============ REAL MEET ============
   Firebase structure:
   realMeetRequests/{pushId} = {
     username, category:'single'|'couple', name, age, location, instagram,
     description, photoUrl, depositAmount, depositUtr, status:'pending', createdAt
   }
   Reuses the same settings/{qrUrl,upiId} already used for subscription payments.
*/
let rmStep = 'category';
let rmCategory = null;
let rmPhotoFile = null;
let rmFormData = null;

function renderRealMeet(){
  const el = document.getElementById('realMeetContent');
  if(!el) return;

  if(rmStep === 'category'){
    el.innerHTML = `
      <div class="rmIntro">Looking to meet in person? Fill out the form below. Our team will reach out on Instagram once your request and security deposit are verified.</div>
      <div class="rmCategoryGrid">
        <div class="rmCategoryCard" onclick="selectRmCategory('single')"><div class="ico">🧑</div><div class="lbl">Single</div></div>
        <div class="rmCategoryCard" onclick="selectRmCategory('couple')"><div class="ico">🧑‍🤝‍🧑</div><div class="lbl">Couple</div></div>
      </div>`;
  } else if(rmStep === 'form'){
    const nameFieldsHtml = rmCategory === 'couple' ? `
      <label class="fieldLabel">Male Name</label>
      <input id="rmNameMale" class="authInput" placeholder="Male partner's name" style="margin-bottom:14px;">

      <label class="fieldLabel">Male Age</label>
      <input id="rmAgeMale" class="authInput" type="number" min="18" placeholder="Male partner's age" style="margin-bottom:14px;">

      <label class="fieldLabel">Female Name</label>
      <input id="rmNameFemale" class="authInput" placeholder="Female partner's name" style="margin-bottom:14px;">

      <label class="fieldLabel">Female Age</label>
      <input id="rmAgeFemale" class="authInput" type="number" min="18" placeholder="Female partner's age" style="margin-bottom:14px;">
    ` : `
      <label class="fieldLabel">Name</label>
      <input id="rmName" class="authInput" placeholder="Your name" style="margin-bottom:14px;">

      <label class="fieldLabel">Age</label>
      <input id="rmAge" class="authInput" type="number" min="18" placeholder="Age" style="margin-bottom:14px;">
    `;
    el.innerHTML = `
      <a class="rmBackLink" onclick="rmStep='category'; renderRealMeet();">← Change category (${rmCategory==='couple'?'Couple':'Single'})</a>
      <div class="modalTitle" style="margin:2px 0 16px;">For Real Meet — Fill Form and Submit</div>

      ${nameFieldsHtml}

      <label class="fieldLabel">From (Location)</label>
      <input id="rmLocation" class="authInput" placeholder="City, State" style="margin-bottom:14px;">

      <label class="fieldLabel">Photo</label>
      <label class="rmPhotoUpload" id="rmPhotoLabel" for="rmPhotoInput">📷 Tap to upload your photo</label>
      <input type="file" id="rmPhotoInput" accept="image/*" class="hidden" onchange="handleRmPhotoSelect()">

      <label class="fieldLabel">Instagram ID (for contact)</label>
      <input id="rmInstagram" class="authInput" placeholder="@yourusername" style="margin-bottom:14px;">

      <label class="fieldLabel">Description</label>
      <textarea id="rmDescription" class="authInput" rows="4" placeholder="Tell us what you're looking for..." style="margin-bottom:18px;resize:vertical;"></textarea>

      <button class="goldBtn" onclick="submitRmForm()">Continue to Security Deposit</button>
    `;
  } else if(rmStep === 'payment'){
    el.innerHTML = `
      <a class="rmBackLink" onclick="rmStep='form'; renderRealMeet();">← Back to form</a>
      <div class="modalTitle" style="margin:2px 0 16px;">Security Deposit</div>
      <div id="rmQrArea">Loading payment details...</div>
    `;
    loadRmPaymentQr();
  } else if(rmStep === 'pending'){
    el.innerHTML = `
      <div class="pendingBox">
        <div class="ico">⏳</div>
        <div style="font-weight:700;margin-bottom:6px;">Request Submitted</div>
        <div style="color:var(--muted);font-size:13px;">Your real meet request and deposit are under review. We'll contact you on Instagram once approved.</div>
      </div>
      <button class="goldBtn" style="margin-top:16px;" onclick="resetRealMeetForm()">Submit Another Request</button>
    `;
  }
}

function selectRmCategory(cat){
  rmCategory = cat;
  rmStep = 'form';
  renderRealMeet();
}

function handleRmPhotoSelect(){
  const file = document.getElementById('rmPhotoInput').files[0];
  rmPhotoFile = file || null;
  const label = document.getElementById('rmPhotoLabel');
  if(rmPhotoFile){
    const url = URL.createObjectURL(rmPhotoFile);
    label.innerHTML = `<img src="${url}">Photo selected — tap to change`;
  } else {
    label.innerHTML = '📷 Tap to upload your photo';
  }
}

function submitRmForm(){
  const location = document.getElementById('rmLocation').value.trim();
  const instagram = document.getElementById('rmInstagram').value.trim();
  const description = document.getElementById('rmDescription').value.trim();

  let personData = {};
  if(rmCategory === 'couple'){
    const nameMale = document.getElementById('rmNameMale').value.trim();
    const ageMale = document.getElementById('rmAgeMale').value.trim();
    const nameFemale = document.getElementById('rmNameFemale').value.trim();
    const ageFemale = document.getElementById('rmAgeFemale').value.trim();
    if(!nameMale || !ageMale || !nameFemale || !ageFemale){ alert('Please fill both partners\' names and ages'); return; }
    personData = { nameMale, ageMale, nameFemale, ageFemale };
  } else {
    const name = document.getElementById('rmName').value.trim();
    const age = document.getElementById('rmAge').value.trim();
    if(!name || !age){ alert('Please fill your name and age'); return; }
    personData = { name, age };
  }

  if(!location || !instagram || !rmPhotoFile){
    alert('Please fill all fields and upload a photo');
    return;
  }
  rmFormData = { ...personData, location, instagram, description };
  rmStep = 'payment';
  renderRealMeet();
}

async function loadRmPaymentQr(){
  const settingsSnap = await db.ref('settings').once('value');
  const settings = settingsSnap.val() || {};
  const area = document.getElementById('rmQrArea');
  if(!area) return;
  area.innerHTML = `
    <div class="qrBox">
      <img src="${settings.qrUrl||''}" alt="Payment QR" onclick="openQrFullscreen('${settings.qrUrl||''}', 999, '${(settings.upiId||'').replace(/'/g,"\\'")}')">
      <div class="upiText">Scan & pay <b>₹999</b> security deposit${settings.upiId?(' to <b>'+escapeHtml(settings.upiId)+'</b>'):''}</div>
      <div class="qrTapHint">${expandIconSvg()} Tap QR to view full screen</div>
    </div>
    <label class="fieldLabel">Enter UTR / Transaction ID</label>
    <input id="rmUtrInput" class="authInput" placeholder="e.g. 402816xxxxxx" style="margin-bottom:14px;">
    <button class="goldBtn" id="rmSubmitBtn" onclick="submitRmFinal()">Submit for Approval</button>
  `;
}

async function submitRmFinal(){
  const utr = document.getElementById('rmUtrInput').value.trim();
  if(utr.length < 4){ alert('Please enter a valid UTR number'); return; }
  if(!rmPhotoFile || !rmFormData){ alert('Something went wrong, please start over'); resetRealMeetForm(); return; }

  const btn = document.getElementById('rmSubmitBtn');
  if(btn){ btn.textContent = 'Submitting...'; btn.disabled = true; }

  try{
    const photoUrl = await uploadToCloudinary(rmPhotoFile);
    const reqId = db.ref('realMeetRequests').push().key;
    await db.ref('realMeetRequests/'+reqId).set({
      username: currentUser,
      category: rmCategory,
      name: rmFormData.name || null,
      age: rmFormData.age || null,
      nameMale: rmFormData.nameMale || null,
      ageMale: rmFormData.ageMale || null,
      nameFemale: rmFormData.nameFemale || null,
      ageFemale: rmFormData.ageFemale || null,
      location: rmFormData.location,
      instagram: rmFormData.instagram,
      description: rmFormData.description,
      photoUrl,
      depositAmount: 999,
      depositUtr: utr,
      status: 'pending',
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });
    rmStep = 'pending';
    renderRealMeet();
  }catch(err){
    console.error(err);
    alert('Something went wrong submitting your form. Please try again.');
    if(btn){ btn.textContent = 'Submit for Approval'; btn.disabled = false; }
  }
}

function resetRealMeetForm(){
  rmStep = 'category';
  rmCategory = null;
  rmPhotoFile = null;
  rmFormData = null;
  renderRealMeet();
}

renderRealMeet();

/* ============ LIVE PREVIEW LOCK ============
   Ab yeh lock USER-LEVEL par Firebase me store hota hai:
   users/{username}/livePreviewUsed = true/false
   Jab admin panel se kisi user ka subscription cancel/expire kiya jayega,
   tab is flag ko bhi false reset karna hoga taaki use dobara free preview mile.
*/
function openLive(id){
  const s = schedulesCache[id];
  const st = scheduleState(s);
  if(st.state !== 'live'){
    alert('This stream hasn\'t started yet. Starts ' + new Date(st.start).toLocaleString('en-IN'));
    return;
  }
  db.ref('liveViews/'+id+'/'+DEVICE_ID).set(true);

  if(hasActiveSub()){
    openFullLiveViewer(id, s, st);
    return;
  }

  db.ref('liveViews/'+id+'/previewSeen/'+DEVICE_ID).set(true);

  // Firebase-based check (user-level, not device/localStorage)
  const alreadyUsed = !!(userData && userData.livePreviewUsed);

  if(alreadyUsed){
    openSubscribeModal();
    return;
  }
  openLivePreview(id, s, st);
}

function startElapsedTimer(elId){
  let secs = 0;
  const el = document.getElementById(elId);
  if(el) el.textContent = '00:00';
  return setInterval(()=>{
    secs++;
    const el2 = document.getElementById(elId);
    if(!el2) return;
    const m = Math.floor(secs/60).toString().padStart(2,'0');
    const sSec = (secs%60).toString().padStart(2,'0');
    el2.textContent = `${m}:${sSec}`;
  },1000);
}

function startRandomChat(chatElId){
  function tick(){
    const box = document.getElementById(chatElId);
    if(!box) return;
    const name = RANDOM_CHAT_NAMES[Math.floor(Math.random()*RANDOM_CHAT_NAMES.length)];
    const line = RANDOM_CHAT_LINES[Math.floor(Math.random()*RANDOM_CHAT_LINES.length)];
    box.insertAdjacentHTML('beforeend', chatRowHtml(name, line));
    box.scrollTop = box.scrollHeight;
  }
  tick();
  return setInterval(tick, 2500 + Math.random()*2500);
}

function bindReactions(id){
  db.ref('liveReactions/'+id).on('value', snap=>{
    const val = snap.val() || {};
    REACTIONS.forEach(r=>{
      const el = document.getElementById('rcnt-'+r.key);
      if(el) el.textContent = val[r.key] || 0;
    });
  });
}

function tapReaction(id, key){
  db.ref('liveReactions/'+id+'/'+key).transaction(cur => (cur||0)+1);
}

function reactionRowHtml(id){
  return REACTIONS.map(r=>`<button class="reactionChip" onclick="tapReaction('${id}','${r.key}')">${r.emoji} <span class="cnt" id="rcnt-${r.key}">0</span></button>`).join('');
}

let _liveTimerHandle = null, _randomChatHandle = null;

function openLivePreview(id, s, st){
  const modal = document.getElementById('modalRoot');
  const offsetSec = Math.max(0, Math.floor((Date.now()-st.start)/1000));
  modal.innerHTML = `
  <div class="liveFull">
    <div class="liveFullTop">
      <div class="left">
        <div class="titleTxt">${escapeHtml(s.title||'Live Stream')}</div>
        <div class="subRow"><span class="liveBadgePill"><span class="dot"></span>LIVE</span><span class="watchingPill">👁 Preview</span></div>
      </div>
      <button class="homeBtn" onclick="closeModal()">← Home</button>
    </div>
    <div class="liveFullStage">
      <div class="liveBadgeOverlay"><span class="dot"></span>LIVE</div>
      <div class="stageTimerPill" id="previewTimer">00:00</div>
      <video id="previewVid" src="${s.videoUrl}" playsinline autoplay muted loop></video>
    </div>
    <div class="reactionRow">${reactionRowHtml(id)}</div>
    <div class="liveChatLabel">💬 LIVE CHAT</div>
    <div class="liveFullChat" id="previewChatBox"></div>
    <div style="text-align:center;color:var(--muted);font-size:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));">Free preview ends in <span id="pcount">5</span>s</div>
  </div>`;
  const vid = document.getElementById('previewVid');
  const startAt = ()=>{
    const dur = vid.duration || 0;
    vid.currentTime = dur > 0 ? (offsetSec % dur) : 0;
    vid.play().catch(()=>{});
  };
  if(vid.readyState >= 1) startAt(); else vid.addEventListener('loadedmetadata', startAt, {once:true});
  setTimeout(()=>{ vid.muted = false; }, 300);

  bindReactions(id);
  _liveTimerHandle = startElapsedTimer('previewTimer');
  _randomChatHandle = startRandomChat('previewChatBox');

  let t = 5;
  const timer = setInterval(()=>{
    t--;
    const el = document.getElementById('pcount'); if(el) el.textContent = t;
    if(t<=0){
      clearInterval(timer);
      clearInterval(_liveTimerHandle);
      clearInterval(_randomChatHandle);
      db.ref('liveReactions/'+id).off();
      // ✅ Firebase me user-level flag set, localStorage nahi
      db.ref('users/'+currentUser+'/livePreviewUsed').set(true);
      openSubscribeModal();
    }
  },1000);
}

function speakerOnSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17.5 8.5a5 5 0 010 7"/><path d="M20 6a9 9 0 010 12"/></svg>`;}
function speakerMutedSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;}
function sendArrowSvg(){return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>`;}

function openFullLiveViewer(id, s, st){
  const modal = document.getElementById('modalRoot');
  const offsetSec = Math.max(0, Math.floor((Date.now()-st.start)/1000));
  modal.innerHTML = `
  <div class="liveFull">
    <div class="liveFullTop">
      <div class="left">
        <div class="titleTxt">${escapeHtml(s.title||'Live Stream')}</div>
        <div class="subRow"><span class="liveBadgePill"><span class="dot"></span>LIVE</span><span class="watchingPill" id="memberCountEl">👁 0 watching</span></div>
      </div>
      <button class="homeBtn" onclick="closeLiveViewer('${id}')">← Home</button>
    </div>
    <div class="liveFullStage">
      <div class="liveBadgeOverlay"><span class="dot"></span>LIVE</div>
      <div class="stageTimerPill" id="liveTimer">00:00</div>
      <video id="liveVid" src="${s.videoUrl}" playsinline autoplay muted loop></video>
    </div>
    <div class="reactionRow">${reactionRowHtml(id)}</div>
    <div class="liveChatLabel">💬 LIVE CHAT</div>
    <div class="liveFullChat" id="chatBox"></div>
    <div class="liveFullInputRow">
      <input id="chatInput" placeholder="Message likhao...">
      <button class="sendCircleBtn" onclick="sendChat('${id}')">${sendArrowSvg()}</button>
    </div>
  </div>`;
  const vid = document.getElementById('liveVid');
  const startAt = ()=>{
    const dur = vid.duration || 0;
    vid.currentTime = dur > 0 ? (offsetSec % dur) : 0;
    vid.play().catch(()=>{});
  };
  if(vid.readyState >= 1) startAt(); else vid.addEventListener('loadedmetadata', startAt, {once:true});
  setTimeout(()=>{ vid.muted = false; }, 300);

  bindReactions(id);
  _liveTimerHandle = startElapsedTimer('liveTimer');
  _randomChatHandle = startRandomChat('chatBox');

  db.ref('liveViews/'+id).on('value', snap=>{
    const val = snap.val()||{};
    const count = Object.keys(val).filter(k=>k!=='previewSeen').length;
    const el = document.getElementById('memberCountEl');
    if(el) el.textContent = '👁 ' + count + ' watching';
  });

  const chatBox = document.getElementById('chatBox');
  db.ref('liveChat/'+id).limitToLast(50).on('child_added', snap=>{
    const m = snap.val();
    chatBox.insertAdjacentHTML('beforeend', chatRowHtml(m.username, m.message));
    chatBox.scrollTop = chatBox.scrollHeight;
  });
  document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(id); });
}

function sendChat(id){
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if(!msg) return;
  db.ref('liveChat/'+id).push({ username: currentUser, message: msg, timestamp: firebase.database.ServerValue.TIMESTAMP });
  input.value = '';
}

function closeLiveViewer(id){
  db.ref('liveViews/'+id).off();
  db.ref('liveChat/'+id).off();
  db.ref('liveReactions/'+id).off();
  if(_liveTimerHandle) clearInterval(_liveTimerHandle);
  if(_randomChatHandle) clearInterval(_randomChatHandle);
  closeModal();
}
</script>
