<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold2:#f0d080;--dark:#0a0a0f;--dark2:#12121a;
  --pink:#e91e8c;--pink2:#ff4db8;--white:#f8f4ee;--gray:#888;
  --red:#ff3b3b;--chat-bg:#0b141a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--dark);color:var(--white);font-family:'Raleway',sans-serif;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px;}
img,video{-webkit-user-select:none!important;user-select:none!important;-webkit-user-drag:none!important;}
body,p,div,span,h1,h2,h3,h4{-webkit-user-select:none;-moz-user-select:none;user-select:none;}
input{-webkit-user-select:text!important;user-select:text!important;}
video::-webkit-media-controls{display:none!important;}
video::-webkit-media-controls-enclosure{display:none!important;}
video::-webkit-media-controls-panel{display:none!important;}
video{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none;}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0;}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0);opacity:0;}
  10%{opacity:.5;}90%{opacity:.2;}
  100%{transform:translateY(-20px);opacity:0;}
}

/* ── TOKEN POPUP OVERLAY ── */
#tokenOverlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:24px;
}
#tokenOverlay.active{display:flex;}
.tok-box{
  background:linear-gradient(135deg,rgba(201,168,76,.12),rgba(233,30,140,.08));
  border:1px solid rgba(201,168,76,.35);border-radius:24px;
  padding:30px 22px;width:100%;max-width:340px;text-align:center;
}
.tok-icon{font-size:52px;margin-bottom:14px;animation:bounce 2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.tok-title{
  font-family:'Playfair Display',serif;font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--gold2),var(--pink2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:8px;
}
.tok-sub{font-size:13px;color:var(--gray);line-height:1.7;margin-bottom:22px;}
.tok-input{
  width:100%;background:rgba(255,255,255,.07);
  border:1.5px solid rgba(201,168,76,.35);border-radius:12px;
  padding:13px 16px;color:var(--white);font-family:'Raleway',sans-serif;
  font-size:15px;outline:none;margin-bottom:12px;
  -webkit-user-select:text!important;user-select:text!important;
  transition:border-color .3s;
}
.tok-input:focus{border-color:var(--gold);}
.tok-input::placeholder{color:rgba(255,255,255,.3);}
.tok-btn{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--pink));
  border:none;border-radius:12px;padding:14px;
  color:#fff;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;letter-spacing:1px;
}
.tok-err{font-size:12px;color:#ff6b6b;margin-top:10px;display:none;}

/* ── COUPON DIVIDER ── */
.tok-divider{
  display:flex;align-items:center;gap:8px;margin:16px 0;
}
.tok-divider-line{flex:1;height:1px;background:rgba(255,255,255,.1);}
.tok-divider-txt{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:1px;}

/* ── COUPON BUTTON ── */
.coupon-btn{
  width:100%;
  background:rgba(201,168,76,.1);
  border:1.5px solid rgba(201,168,76,.5);
  border-radius:12px;padding:13px;
  color:#f0d080;font-family:'Raleway',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;
  letter-spacing:1px;
  transition:background .2s, transform .15s;
  position:relative;overflow:hidden;
}
.coupon-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06),transparent);
  pointer-events:none;
}
.coupon-btn:active{transform:scale(.97);}
.coupon-btn:hover{background:rgba(201,168,76,.2);}
.coupon-hint{
  font-size:11px;color:rgba(255,255,255,.28);
  margin-top:9px;line-height:1.6;
}

/* ── PREVIEW COUNTDOWN BAR ── */
#previewBar{
  display:none;position:absolute;bottom:0;left:0;right:0;z-index:20;
  padding:10px 14px 14px;
  background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
  flex-direction:column;align-items:center;gap:6px;
}
#previewBar.active{display:flex;}
.prev-label{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:1px;}
.prev-track{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;}
.prev-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));border-radius:2px;width:100%;transition:width 1s linear;}
.prev-sec{font-size:18px;font-weight:700;color:#fff;}

/* ── LIVE SCREEN ── */
#liveScreen{
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
}

/* Header */
.live-hdr{
  flex-shrink:0;
  background:rgba(10,10,15,.95);backdrop-filter:blur(10px);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(201,168,76,.15);z-index:50;
}
.live-hdr-left{display:flex;align-items:center;gap:10px;}
.live-badge{display:flex;align-items:center;gap:6px;background:var(--red);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;color:#fff;letter-spacing:1px;}
.live-dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:ldot 1s ease-in-out infinite;}
@keyframes ldot{0%,100%{opacity:1;}50%{opacity:.2;}}
.live-viewers{font-size:12px;color:var(--gray);display:flex;align-items:center;gap:4px;}
.live-back-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:6px 14px;color:var(--white);font-family:'Raleway',sans-serif;font-size:12px;cursor:pointer;}

/* Video */
.live-video-wrap{
  flex-shrink:0;position:relative;
  width:100%;height:40vh;background:#000;overflow:hidden;
}
#liveVid{
  width:100%;height:100%;object-fit:cover;display:block;
}
.vid-live-tag{
  position:absolute;top:10px;left:10px;z-index:10;
  display:flex;align-items:center;gap:5px;
  background:var(--red);border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:700;color:#fff;letter-spacing:1px;
}
.vid-live-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:ldot 1s ease-in-out infinite;}
.vid-dur{
  position:absolute;top:10px;right:10px;z-index:10;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  border-radius:20px;padding:4px 12px;font-size:11px;color:rgba(255,255,255,.85);
}
#vidBlur{
  position:absolute;inset:0;z-index:15;
  backdrop-filter:blur(18px);
  background:rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
#vidBlur.hidden{display:none;}
.blur-lock{font-size:40px;}
.blur-txt{font-size:13px;color:rgba(255,255,255,.7);text-align:center;line-height:1.6;}

/* Reactions */
.reactions-bar{
  flex-shrink:0;background:var(--dark2);
  padding:8px 14px;display:flex;align-items:center;gap:8px;
  overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.06);
}
.reactions-bar::-webkit-scrollbar{display:none;}
.react-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:6px 12px;font-size:15px;cursor:pointer;
  transition:transform .2s;flex-shrink:0;
  display:flex;align-items:center;gap:5px;pointer-events:auto;
}
.react-btn:active{transform:scale(1.25);}
.react-count{font-size:10px;color:var(--gray);}
.fly-emoji{position:fixed;font-size:22px;animation:flyUp2 2.5s ease-out forwards;pointer-events:none;z-index:999;}
@keyframes flyUp2{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-180px) scale(1.4);opacity:0;}}

/* Chat */
.live-chat-wrap{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);overflow:hidden;min-height:0;}
.live-chat-title{flex-shrink:0;padding:10px 16px;font-size:12px;font-weight:700;color:var(--gold2);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:6px;}
.live-msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-height:0;-webkit-overflow-scrolling:touch;}
.live-msg{display:flex;gap:8px;align-items:flex-start;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.live-msg-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--pink));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.live-msg-body{flex:1;}
.live-msg-name{font-size:10px;color:var(--gold2);font-weight:700;margin-bottom:2px;}
.live-msg-text{font-size:13px;color:rgba(255,255,255,.85);line-height:1.4;word-break:break-word;}
.live-msg-img{width:130px;border-radius:10px;margin-top:4px;display:block;pointer-events:none;}
.live-msg.is-host .live-msg-avatar{background:linear-gradient(135deg,var(--red),#ff6b6b);}
.live-msg.is-host .live-msg-name{color:#ff9a9a;}

/* Input */
.live-input-wrap{flex-shrink:0;background:var(--dark2);padding:10px 12px;display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.06);padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.live-file-btn{background:none;border:none;color:var(--gray);font-size:22px;cursor:pointer;padding:4px;pointer-events:auto;}
#liveChatInput{flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);border-radius:20px;padding:9px 16px;color:#fff;font-family:'Raleway',sans-serif;font-size:14px;outline:none;-webkit-user-select:text!important;user-select:text!important;}
#liveChatInput::placeholder{color:rgba(255,255,255,.3);}
.live-send-btn{background:linear-gradient(135deg,var(--gold),var(--pink));border:none;width:40px;height:40px;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;pointer-events:auto;}
#livePhotoInput{display:none;}
.chat-photo-prev{display:none;background:rgba(255,255,255,.05);border-top:1px solid rgba(255,255,255,.08);padding:8px 14px;flex-shrink:0;align-items:center;gap:10px;}
.chat-photo-prev.show{display:flex;}
.cprev-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;pointer-events:none;}
.cprev-name{font-size:12px;color:var(--gray);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cprev-rm{background:none;border:none;color:#e06060;font-size:18px;cursor:pointer;}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(30,30,40,.95);border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:11px 22px;color:var(--white);font-size:13px;z-index:9999;transition:transform .4s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(10px);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
const IMGBB_KEY = 'c4b4735988d74b7ebb4119130a8cb07c';
const VALID_TOKEN = 'VIP786';

document.addEventListener('contextmenu', e => e.preventDefault());

/* ── PARTICLES ── */
(function(){
  const c = document.getElementById('particles');
  for(let i=0;i<10;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = 'left:'+Math.random()*100+'%;width:'+(1+Math.random()*3)+'px;height:'+(1+Math.random()*3)+'px;animation-duration:'+(8+Math.random()*12)+'s;animation-delay:'+Math.random()*10+'s;background:'+(Math.random()>.5?'#c9a84c':'#e91e8c')+';';
    c.appendChild(p);
  }
})();

/* ── DEVICE FINGERPRINT ── */
function getFingerprint(){
  const raw = [
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    navigator.hardwareConcurrency || '',
    navigator.platform || ''
  ].join('|');
  let h = 0;
  for(let i = 0; i < raw.length; i++){
    h = Math.imul(31, h) + raw.charCodeAt(i) | 0;
  }
  const lsKey = 'vip_fp_id';
  let stored = localStorage.getItem(lsKey);
  if(!stored){
    stored = 'fp_' + Math.abs(h).toString(36) + '_' + Date.now().toString(36);
    localStorage.setItem(lsKey, stored);
  }
  return stored;
}

const DEVICE_KEY = getFingerprint();

function previewAlreadySeen(){ return localStorage.getItem('prev_done_'+DEVICE_KEY) === '1'; }
function markPreviewDone(){ localStorage.setItem('prev_done_'+DEVICE_KEY, '1'); }
function hasValidToken(){ return localStorage.getItem('tok_ok_'+DEVICE_KEY) === '1'; }
function markTokenValid(){ localStorage.setItem('tok_ok_'+DEVICE_KEY, '1'); }

/* ── STATE ── */
let uname = localStorage.getItem('vip_uname') || 'Guest';
let uid   = localStorage.getItem('vip_uid')   || ('u_'+Date.now());
let pendPhoto = null;
let liveUnlocked = false;

const EMOJIS    = { heart:'❤️', fire:'🔥', love:'😍', clap:'👏', gem:'💎', hug:'🥰' };
const reactNums = { heart:0, fire:0, love:0, clap:0, gem:0, hug:0 };
const reactIds  = { heart:'rc1', fire:'rc2', love:'rc3', clap:'rc4', gem:'rc5', hug:'rc6' };

/* ── INIT ── */
window.addEventListener('load', () => {
  startViewerCount();
  startDurationTimer();
  initLiveChat();
  loadReactions();

  const vid = document.getElementById('liveVid');

  if(hasValidToken()){
    unlockFull(vid);
  } else if(previewAlreadySeen()){
    vid.pause();
    showBlur();
    showTokenOverlay();
  } else {
    startPreview(vid);
  }
});

/* ── PREVIEW ── */
function startPreview(vid){
  vid.muted = true;
  vid.play().catch(()=>{});

  const bar  = document.getElementById('previewBar');
  const fill = document.getElementById('prevFill');
  const sec  = document.getElementById('prevSec');
  bar.classList.add('active');

  let remaining = 5;
  fill.style.transition = 'none';
  fill.style.width = '100%';

  setTimeout(()=>{
    fill.style.transition = 'width 5s linear';
    fill.style.width = '0%';
  }, 60);

  const iv = setInterval(()=>{
    remaining--;
    sec.textContent = remaining;
    if(remaining <= 0){
      clearInterval(iv);
      markPreviewDone();
      bar.classList.remove('active');
      vid.pause();
      showBlur();
      showTokenOverlay();
    }
  }, 1000);
}

/* ── BLUR VIDEO ── */
function showBlur(){
  document.getElementById('vidBlur').classList.remove('hidden');
}
function hideBlur(){
  document.getElementById('vidBlur').classList.add('hidden');
}

/* ── TOKEN OVERLAY ── */
function showTokenOverlay(){
  document.getElementById('tokenOverlay').classList.add('active');
}

function verifyToken(){
  const val = document.getElementById('tokenInput').value.trim().toUpperCase();
  const errEl = document.getElementById('tokErr');
  errEl.style.display = 'none';

  if(!val){ showToast('Token code daalo!'); return; }

  if(val === VALID_TOKEN){
    markTokenValid();
    document.getElementById('tokenOverlay').classList.remove('active');
    hideBlur();
    const vid = document.getElementById('liveVid');
    unlockFull(vid);
    showToast('✅ Access unlock ho gaya!');
  } else {
    errEl.style.display = 'block';
    document.getElementById('tokenInput').style.borderColor = '#e91e8c';
    setTimeout(()=>{
      document.getElementById('tokenInput').style.borderColor = 'rgba(201,168,76,.35)';
    }, 2000);
  }
}

/* ── GET COUPON CODE — Chat redirect ── */
function getCouponCode(){
  // index.html ke chat mein redirect karo with flag
  window.location.href = 'index.html?openchat=1';
}

/* ── UNLOCK FULL VIDEO ── */
function unlockFull(vid){
  liveUnlocked = true;
  vid.muted = false;
  vid.play().catch(()=>{ vid.muted = true; vid.play(); });
}

/* ── DURATION TIMER ── */
let liveStartTime = Date.now();
function startDurationTimer(){
  setInterval(()=>{
    const sec = Math.floor((Date.now()-liveStartTime)/1000);
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    document.getElementById('liveDuration').textContent = m+':'+s;
  }, 1000);
}

/* ── FAKE VIEWERS ── */
function startViewerCount(){
  let v = Math.floor(Math.random()*150)+80;
  document.getElementById('viewerCount').textContent = v;
  setInterval(()=>{
    v += Math.floor(Math.random()*9)-4;
    if(v < 60) v = 60;
    if(v > 300) v = 300;
    document.getElementById('viewerCount').textContent = v;
  }, 4000);
}

/* ── REACTIONS ── */
function loadReactions(){
  if(!window._fbOk) return;
  const { db, ref, onValue } = window._FB;
  onValue(ref(db,'liveReactions'), snap => {
    const data = snap.val() || {};
    for(const key of Object.keys(reactNums)){
      reactNums[key] = data[key] || 0;
      document.getElementById(reactIds[key]).textContent = reactNums[key];
    }
  });
}

function sendReaction(key){
  reactNums[key]++;
  document.getElementById(reactIds[key]).textContent = reactNums[key];
  floatEmoji(EMOJIS[key]);
  if(window._fbOk){
    const { db, ref, set } = window._FB;
    set(ref(db,'liveReactions/'+key), reactNums[key]);
  }
}

function floatEmoji(emoji){
  const el = document.createElement('div');
  el.className = 'fly-emoji';
  el.textContent = emoji;
  el.style.right = (10 + Math.random()*40)+'px';
  el.style.bottom = '140px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ── FAKE CHAT ── */
const RNAMES = ['alok','abhii','fuck','hey','xxfu','aman'];
const RMSGS  = [
  'chut dikhao ab rand 😍','sexy maal h tu to  🔥','Love you so much❤️',
  'ufff yrr 💯','real meet kroge','chatni h teri hume sbko🌹',
];
let chatInited = false;

function initLiveChat(){
  if(chatInited) return;
  chatInited = true;

  setTimeout(()=>{ addFakeMsg(); scheduleNextFake(); }, 1800);

  if(window._fbOk){
    const { db, ref, onChildAdded } = window._FB;
    onChildAdded(ref(db,'liveChatMsgs'), snap => {
      const m = snap.val();
      if(m) addMsg({ name:m.username||'User', text:m.text, imgUrl:m.imgUrl, isHost:m.isHost||false });
    });
  }
}

function scheduleNextFake(){
  setTimeout(()=>{ addFakeMsg(); scheduleNextFake(); }, 2500 + Math.random()*5000);
}

function addFakeMsg(){
  const name = RNAMES[Math.floor(Math.random()*RNAMES.length)];
  const text = RMSGS[Math.floor(Math.random()*RMSGS.length)];
  addMsg({ name, text, isHost:false });
}

function addMsg({ name, text, imgUrl, isHost }){
  const area = document.getElementById('liveMsgs');
  const div = document.createElement('div');
  div.className = 'live-msg'+(isHost?' is-host':'');
  const init = name.charAt(0).toUpperCase();
  let inner = '<div class="live-msg-avatar">'+init+'</div><div class="live-msg-body"><div class="live-msg-name">'+esc(name)+'</div>';
  if(imgUrl) inner += '<img src="'+imgUrl+'" class="live-msg-img" oncontextmenu="return false">';
  if(text)   inner += '<div class="live-msg-text">'+esc(text)+'</div>';
  inner += '</div>';
  div.innerHTML = inner;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

async function sendLiveMsg(){
  const inp = document.getElementById('liveChatInput');
  const txt = inp.value.trim();
  if(!txt && !pendPhoto) return;
  inp.value = '';
  let imgUrl = null;
  if(pendPhoto){
    try{
      showToast('Uploading...');
      imgUrl = await uploadToImgBB(pendPhoto.dataUrl);
      removeChatPhoto();
    }catch(e){ showToast('Upload failed'); return; }
  }
  addMsg({ name:uname, text:txt, imgUrl, isHost:false });
  if(window._fbOk){
    const { db, ref, push } = window._FB;
    push(ref(db,'liveChatMsgs'),{
      uid, username:uname,
      text:txt||'', imgUrl:imgUrl||null,
      timestamp:Date.now(), isHost:false
    });
  }
}

function onLivePhoto(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    pendPhoto = { dataUrl:ev.target.result, name:f.name };
    document.getElementById('cprevThumb').src = ev.target.result;
    document.getElementById('cprevName').textContent = f.name;
    document.getElementById('chatPhotoPrev').classList.add('show');
  };
  r.readAsDataURL(f); e.target.value='';
}

function removeChatPhoto(){
  pendPhoto = null;
  document.getElementById('chatPhotoPrev').classList.remove('show');
  document.getElementById('cprevThumb').src = '';
}

async function uploadToImgBB(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const fd = new FormData();
  fd.append('key', IMGBB_KEY);
  fd.append('image', base64);
  const res = await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd});
  const json = await res.json();
  if(json.success) return json.data.url;
  throw new Error('failed');
}

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

window.verifyToken     = verifyToken;
window.getCouponCode   = getCouponCode;
window.sendReaction    = sendReaction;
window.sendLiveMsg     = sendLiveMsg;
window.onLivePhoto     = onLivePhoto;
window.removeChatPhoto = removeChatPhoto;
</script>
